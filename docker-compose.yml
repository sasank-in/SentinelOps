# SentinelOps Phase 1: demo microservices.
#   docker compose up --build -d
#   Gateway:          http://localhost:8080/api/orders
#   Failure endpoints: order :8081/failure, payment :8082/failure, gateway :8080/failure

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-chaos}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 3s
    start_period: 60s
    retries: 5
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 768M

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ORDERS_DB_USER: ${ORDERS_DB_USER:-orders}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER:-payments}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
    volumes:
      - ./infrastructure/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    <<: *java-service
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      args:
        SERVICE: payment-service
    image: sentinelops/payment-service:${PAYMENT_VERSION:-1.8.1}
    environment:
      <<: *java-env
      PORT: 8080
      APP_VERSION: ${PAYMENT_VERSION:-1.8.1}
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USER: ${PAYMENTS_DB_USER:-payments}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
      DB_POOL_SIZE: ${PAYMENT_DB_POOL_SIZE:-10}
      PAYMENT_FRAUD_CHECK_DELAY: ${PAYMENT_FRAUD_CHECK_DELAY:-0ms}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    <<: *java-service
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      args:
        SERVICE: order-service
    image: sentinelops/order-service:${ORDER_VERSION:-1.0.0}
    environment:
      <<: *java-env
      PORT: 8080
      APP_VERSION: ${ORDER_VERSION:-1.0.0}
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: ${ORDERS_DB_USER:-orders}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
      PAYMENT_SERVICE_URL: http://payment-service:8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy

  api-gateway:
    <<: *java-service
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      args:
        SERVICE: api-gateway
    image: sentinelops/api-gateway:${GATEWAY_VERSION:-1.0.0}
    environment:
      <<: *java-env
      PORT: 8080
      APP_VERSION: ${GATEWAY_VERSION:-1.0.0}
      ORDER_SERVICE_URL: http://order-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
    ports:
      - "8080:8080"
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

volumes:
  postgres-data:
