spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      pool-name: orders-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast on pool exhaustion so it surfaces as errors, not hung requests.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8081}
  shutdown: graceful

services:
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: ${PAYMENT_READ_TIMEOUT:5s}

app:
  version: ${APP_VERSION:1.0.0}

info:
  app:
    name: ${spring.application.name}
    version: ${app.version}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${app.version}
    distribution:
      percentiles-histogram:
        http.server.requests: true
