# Single shared PostgreSQL instance with one database per service.
# Credentials come from the `postgres-credentials` Secret (generated by the overlay).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Keep in sync with infrastructure/docker/postgres/init-databases.sh (docker-compose).
  init-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    create_db() {
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -c "CREATE ROLE $2 LOGIN PASSWORD '$3';" \
        -c "CREATE DATABASE $1 OWNER $2;"
    }
    create_db orders   "$ORDERS_DB_USER"   "$ORDERS_DB_PASSWORD"
    create_db payments "$PAYMENTS_DB_USER" "$PAYMENTS_DB_PASSWORD"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
            - name: ORDERS_DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: ORDERS_DB_USER }
            - name: ORDERS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: ORDERS_DB_PASSWORD }
            - name: PAYMENTS_DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: PAYMENTS_DB_USER }
            - name: PAYMENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: PAYMENTS_DB_PASSWORD }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
